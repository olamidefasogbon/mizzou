<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Mizzou left panel</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif}
a:active,button:active{opacity:0.72}
</style>

</head>
<body>

<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #E9E9EB; color: #000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif">
  <div style="position: absolute; top: -80px; right: -100px; width: 300px; height: 300px; border-radius: 150px; background: #CFCFD4; filter: blur(60px)"></div>
  <div style="position: absolute; bottom: 120px; right: -110px; width: 320px; height: 320px; border-radius: 160px; background: #C4C4CA; filter: blur(70px)"></div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 0 40px; opacity: 0.35">
    <p style="margin: 0; font-size: 34px; line-height: 1.15; font-weight: 700; color: #000">Howdy, John</p>
  </div>

  <a href="Chat.html" aria-label="Close menu" style="position: absolute; top: 0; bottom: 0; left: 300px; right: 0; background: rgba(0,0,0,0.10)"></a>

  <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 304px; box-sizing: border-box; padding: 58px 16px 30px; display: flex; flex-direction: column; background: rgba(240,240,243,0.72); backdrop-filter: blur(32px) saturate(180%); -webkit-backdrop-filter: blur(32px) saturate(180%); border-right: 1px solid rgba(255,255,255,0.8); box-shadow: 10px 0 40px rgba(0,0,0,0.10)">

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 8px; height: 44px">
      <div style="font-family: 'Pinyon Script', cursive; font-size: 38px; line-height: 1; color: #000">Mizzou</div>
      <a href="Chat.html" aria-label="New chat" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.07), inset 0 1px 0 rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5H8.5A3.5 3.5 0 005 8.5v7A3.5 3.5 0 008.5 19h7a3.5 3.5 0 003.5-3.5V12M17.5 4.5a1.8 1.8 0 012.5 2.5L12 15l-3.5.5L9 12z"/></svg>
      </a>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 8px 6px">
      <span style="font-size: 13px; font-weight: 600; color: #48484A">Reminders</span>
      <span style="display: flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px; background: rgba(120,120,128,0.2); font-size: 12px; font-weight: 600; color: #000">3</span>
    </div>

    <div style="box-sizing: border-box; padding: 4px 12px; border-radius: 22px; background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.07), inset 0 1px 0 rgba(255,255,255,0.9), 0 8px 24px rgba(0,0,0,0.05)">
      <div style="display: flex; align-items: center; gap: 10px; height: 56px">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Fulbright 2027</span>
          <span style="font-size: 13px; color: #48484A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Statement not finished</span>
        </div>
        <span style="flex: none; display: flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(120,120,128,0.2); font-size: 12px; font-weight: 600; color: #000">6 days</span>
      </div>
      <div style="height: 1px; background: rgba(60,60,67,0.14)"></div>
      <div style="display: flex; align-items: center; gap: 10px; height: 56px">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Yale PhD</span>
          <span style="font-size: 13px; color: #48484A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Portal opens soon</span>
        </div>
        <span style="flex: none; display: flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(120,120,128,0.2); font-size: 12px; font-weight: 600; color: #000">Soon</span>
      </div>
      <div style="height: 1px; background: rgba(60,60,67,0.14)"></div>
      <div style="display: flex; align-items: center; gap: 10px; height: 56px">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Summer internship</span>
          <span style="font-size: 13px; color: #48484A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">2 documents left</span>
        </div>
        <span style="flex: none; display: flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(120,120,128,0.2); font-size: 12px; font-weight: 600; color: #000">9 days</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 8px 4px">
      <span style="font-size: 13px; font-weight: 600; color: #48484A">Chats</span>
      <button style="border: 0; background: transparent; padding: 6px 0 6px 12px; font-family: inherit; font-size: 13px; font-weight: 600; color: #000; cursor: pointer">Clear all</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 14px; background: rgba(120,120,128,0.16); font-size: 15px; font-weight: 500; color: #000">Yale PhD application</div>
      <div style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 14px; font-size: 15px; color: #000">Fulbright 2027</div>
      <div style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 14px; font-size: 15px; color: #000">Summer research internship</div>
      <div style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 14px; font-size: 15px; color: #000">Chevening scholarship</div>
    </div>

    <div style="flex: 1"></div>

    <div style="box-sizing: border-box; padding: 2px 8px; border-radius: 26px; background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.07), inset 0 1px 0 rgba(255,255,255,0.9), 0 8px 24px rgba(0,0,0,0.05)">
      <a href="Panel.html" style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 6px; text-decoration: none; color: #000">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3h0a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5h0a1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9v0a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
        <span style="flex: 1; font-size: 16px; font-weight: 500">Settings</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#48484A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </a>
      <div style="height: 1px; margin: 0 6px; background: rgba(60,60,67,0.14)"></div>
      <a href="Logout.html" style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 6px; text-decoration: none; color: #000">
        <div aria-hidden="true" style="flex: none; width: 38px; height: 38px; border-radius: 19px; background: rgba(120,120,128,0.22); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">J</div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 16px; font-weight: 600">John</span>
          <span style="font-size: 13px; color: #48484A">Signed in with Google</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#48484A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 14l5 5 5-5M7 10l5-5 5 5"/></svg>
      </a>
    </div>
  </div>
</div>


</body>
</html>
